<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ten Kind Hands | Restoring Dignity Through Education &amp; Healthcare</title>
    
    <!-- Google Fonts: Poppins (Headings) + Open Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#8f2830",
              "primary-dark": "#721c23",
              "primary-hover": "#a8323c",
              "forest": "#1f3b34",
              "forest-dark": "#142722",
              "clay": "#c27d38",
              "sand": "#f8f6f2",
              "sand-dark": "#ede8df",
              "border-subtle": "#e6e0d6",
              "ink": "#1e1b1b",
              "ink-light": "#524b4b",
              "ink-muted": "#827878"
            },
            fontFamily: {
              "sans": ["'Open Sans'", "sans-serif"],
              "heading": ["'Poppins'", "sans-serif"],
              "serif": ["'Poppins'", "sans-serif"],
              "mono": ["'Space Grotesk'", "monospace"]
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-white text-ink font-sans antialiased overflow-x-hidden selection:bg-primary/15 selection:text-primary">
